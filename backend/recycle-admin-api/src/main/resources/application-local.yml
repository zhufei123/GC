# 本地联调配置（本仓库可提交；生产用环境变量注入，勿抄此文件）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/recycle?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: recycle
    password: recycle@Dev123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 本地 Redis 无密码
      database: 0
      timeout: 3s

app:
  wx:
    # 小程序登录（appid+secret 同时非空才走真实 jscode2session，否则 code 即 openid）
    # https://developers.weixin.qq.com/miniprogram/dev/OpenApiDoc/user-login/code2Session.html
    appid: ""
    secret: ""
    # 商家转账（mock=false 时需 mch-id + api-v3-key + mch-serial-no + transfer-scene-id + appid）
    # https://pay.weixin.qq.com/doc/v3/merchant/4012716434
    mch-id: ""
    api-v3-key: ""
    mch-serial-no: ""
    private-key-pem: ""
    notify-url: ""
    # 订阅消息官方必填 miniprogram_state / lang；page 建议订单详情
    # https://developers.weixin.qq.com/miniprogram/dev/OpenApiDoc/mp-message-management/subscribe-message/sendMessage.html
    miniprogram-state: formal
    lang: zh_CN
    subscribe-page: pages-customer/order/detail
    transfer-scene-id: ""
    user-recv-perception: 回收货款
    # mock=true：微信打款落 WAIT_USER_CONFIRM，等 C 端确认收款，不发起外部 HTTP
    mock: true
    subscribe-templates:
      ORDER_ACCEPTED: ""
      ORDER_WEIGHED: ""
      ORDER_COMPLETED: ""
  alipay:
    # https://opendocs.alipay.com/mini/84bc7352_alipay.system.oauth.token
    # https://opendocs.alipay.com/mini/6430ce5a_alipay.open.app.mini.templatemessage.send
    app-id: ""
    private-key: ""
    alipay-public-key: ""
    gateway: https://openapi.alipay.com/gateway.do
    encrypt-key: ""
    sign-type: RSA2
    charset: utf-8
    message-page: pages-customer/order/detail
    transfer-product-code: TRANS_ACCOUNT_NO_PWD
    transfer-identity-type: ALIPAY_OPEN_ID
    notify-url: ""
    # mock=true：支付宝打款进程内直接成功
    mock: true
    message-templates:
      ORDER_ACCEPTED: ""
      ORDER_WEIGHED: ""
      ORDER_COMPLETED: ""
