spring:
  application:
    name: recycle-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jackson:
    # java.util.Date 用；java.time 字段以 @JsonFormat 为准（GMT+8）
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  # 请求头直接传 token 值，无 Bearer 前缀
  token-prefix: ""
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-read-cookie: false
  is-read-header: true
  is-log: false

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: admin-api
      paths-to-match: /admin-api/**
    - group: app-api
      paths-to-match: /app-api/**

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  sms:
    # mock 模式：验证码固定 123456
    mock: true
  cos:
    bucket: recycle-mock-1250000000
    region: ap-guangzhou
    cdn-host: https://cdn.example.com
  # 微信小程序：appid 必须与 openid / 商家转账 / 订阅消息同应用
  # https://developers.weixin.qq.com/miniprogram/dev/OpenApiDoc/user-login/code2Session.html
  # https://developers.weixin.qq.com/miniprogram/dev/OpenApiDoc/mp-message-management/subscribe-message/sendMessage.html
  # https://pay.weixin.qq.com/doc/v3/merchant/4012716434
  wx:
    appid: ""
    secret: ""
    mch-id: ""
    api-v3-key: ""
    mch-serial-no: ""
    private-key-pem: ""
    notify-url: ""
    miniprogram-state: formal
    lang: zh_CN
    subscribe-page: pages-customer/order/detail
    transfer-scene-id: ""
    user-recv-perception: 回收货款
    mock: true
  # 支付宝小程序：app_id 必须与 oauth / 模板消息 / 转账同应用
  # https://opendocs.alipay.com/mini/84bc7352_alipay.system.oauth.token
  # https://opendocs.alipay.com/mini/6430ce5a_alipay.open.app.mini.templatemessage.send
  alipay:
    app-id: ""
    private-key: ""
    alipay-public-key: ""
    gateway: https://openapi.alipay.com/gateway.do
    encrypt-key: ""
    sign-type: RSA2
    charset: utf-8
    message-page: pages-customer/order/detail
    transfer-product-code: TRANS_ACCOUNT_NO_PWD
    transfer-identity-type: ALIPAY_OPEN_ID
    notify-url: ""
    mock: true

logging:
  level:
    com.recycle: info
