# 本地开发: MySQL 8.4 + Redis 7
# 启动: docker compose -f deploy/docker-compose.local.yml up -d
# 销毁(含数据): docker compose -f deploy/docker-compose.local.yml down -v
name: recycle-local

services:
  mysql:
    image: mysql:8.4
    container_name: recycle-mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: recycle@Root123
      MYSQL_DATABASE: recycle
      MYSQL_USER: recycle
      MYSQL_PASSWORD: recycle@Dev123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=300
      - --innodb-buffer-pool-size=512M
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-precycle@Root123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: recycle-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - recycle@Dev123
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "recycle@Dev123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
